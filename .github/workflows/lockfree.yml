name: lockfree

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: Build
      run: go build -v ./...
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -v -timeout 30m ./...

  race:
    name: Race
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: Race test
      run: go test -v -race -timeout 60m ./...

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: Fuzz skip list (lock-free)
      run: go test -run '^$' -fuzz=FuzzSkipList -fuzztime=120s ./lf
    - name: Fuzz deque (lock-free)
      run: go test -run '^$' -fuzz=FuzzDeque -fuzztime=120s ./lf
    - name: Fuzz queue (wait-free)
      run: go test -run '^$' -fuzz=FuzzQueue -fuzztime=120s ./wf
    - name: Fuzz stack (wait-free)
      run: go test -run '^$' -fuzz=FuzzStack -fuzztime=120s ./wf

  bench:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26'
    - name: Benchmark (mutex vs lock-free vs wait-free)
      # Smoke test only: a tiny benchtime keeps the swept sub-benchmarks fast.
      # Run locally with a real -benchtime to get meaningful numbers.
      run: go test -run '^$' -bench=. -benchtime=10ms -benchmem -timeout 30m ./...
